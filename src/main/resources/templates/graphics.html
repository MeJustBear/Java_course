<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: pageHead}"></head>
<body>
<div th:replace="~{fragments/header :: topBar('Student')}"></div>
<h3 th:text="'Marks: ' + ${subject.subjectName}">Subject</h3>

<div style="max-width: 700px; margin: 0 auto;">
    <canvas id="marksChart"></canvas>
</div>

<div><button><a href="/schedule/">To the main page</a></button></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:inline="javascript">
    const labels = /*[[${subject.lessons.![lessonName + ' (' + date + ')']}]]*/ [];
    const marks = /*[[${subject.lessons.![mark]}]]*/ [];
    new Chart(document.getElementById('marksChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: /*[[${subject.subjectName}]]*/ 'Marks',
                data: marks,
                borderColor: '#4A82D7',
                backgroundColor: 'rgba(74,130,215,0.2)',
                tension: 0.2
            }]
        },
        options: {
            scales: { y: { min: 0, max: 5, ticks: { stepSize: 1 } } }
        }
    });
</script>

</body>
</html>
